[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pysrc", "pysrc.services", "pysrc.sampling"]

[project]
name = "amazon-carbon-prices"
version = "0.2.1"
requires-python = ">=3.9,<3.12"
dependencies = [
    "numpy == 1.25.2",
    "pandas == 2.1.0",
    "geopandas == 0.14.4",
    "pyomo == 6.6.2",
    "cmdstanpy == 1.2.0",
    "scipy == 1.11.1",
    "matplotlib == 3.7.3",
    "seaborn == 0.13.2",
    "jinja2 == 3.1.6",
    "hmmlearn == 0.3.3",
]

[project.optional-dependencies]
notebooks = ["ipykernel"]
dev = ["black", "ruff", "pre-commit"]
all = ["amazon-carbon-prices[notebooks, dev]"]

[tool.ruff]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
    "I002",
]
